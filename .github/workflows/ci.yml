name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python checks (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.13", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy portfolioos

      - name: Test + coverage (pytest)
        run: uv run pytest --cov --cov-report=term-missing
      - name: Build the API documentation
        run: uv run --frozen sphinx-build -W -b html docs .reports/docs

  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check file sizes (≤700 effective lines)
        run: |
          python scripts/check-file-size.py $(find python/portfolioos python/tests python/scripts src electron \
            -type f \( -name '*.py' -o -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' \) \
            2>/dev/null || true)

      - name: Check function lengths (≤100 effective lines)
        run: |
          python scripts/check-function-length.py $(find python/portfolioos python/tests python/scripts src electron \
            -type f \( -name '*.py' -o -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' \) \
            2>/dev/null || true)

  typescript:
    name: TypeScript checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install uv (for sidecar tests)
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python (for sidecar tests)
        run: uv python install
        working-directory: python

      - name: Install Python dependencies
        run: uv sync --group dev
        working-directory: python

      - name: Install Node dependencies
        run: pnpm install

      - name: Type check
        run: pnpm run build

      - name: Test
        run: pnpm run test
      - name: Verify shared database files across Python and Node
        run: node scripts/verify-db-interop.mjs
      - name: Verify the dead-code analyzer and load the project configuration
        run: node scripts/verify-analyzer.mjs

  desktop:
    name: Packaged desktop behavior
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
      - name: Install Python sidecar
        run: uv sync --project python --frozen --group dev
      - name: Package the application
        run: |
          set -o pipefail
          mkdir -p verification-results
          pnpm install --frozen-lockfile
          pnpm exec install-electron
          MAKEFLAGS=-j4 pnpm run package 2>&1 | tee verification-results/packaging.log
      - name: Run the packaged app under Xvfb
        env:
          DEBUG: pw:browser*
          ELECTRON_ENABLE_LOGGING: '1'
        run: |
          set -o pipefail
          xvfb-run -a pnpm run verify:desktop 2>&1 | tee verification-results/desktop.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: packaged-desktop-evidence
          path: verification-results/
          if-no-files-found: warn

  agents:
    name: Agent package behavior (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.13", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --project agents --frozen --group dev
      - name: Verify scanners, fixture provider handling, and blackboard state
        run: |
          set -o pipefail
          uv run --project agents --frozen pytest agents/tests 2>&1 | tee agents-verification.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agents-verification-${{ matrix.python }}
          path: agents-verification.log
          if-no-files-found: warn

  container:
    name: Offline container sidecar behavior
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Build the runtime image and exercise the sidecar
        run: |
          set -o pipefail
          mkdir -p verification-results
          docker build -t portfolioos:verification . 2>&1 | tee verification-results/docker-build.log
          bash scripts/verify-container.sh portfolioos:verification 2>&1 | tee verification-results/docker-sidecar.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: container-verification
          path: verification-results/
          if-no-files-found: warn
